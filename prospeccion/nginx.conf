server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  location ~* \.(html|css|js)$ { add_header Cache-Control "no-cache, must-revalidate"; }
  location ~* \.(webp|png|jpg|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=2592000"; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff;
}
